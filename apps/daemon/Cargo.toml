[package]
name = "custos-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Custos Daemon: Composition Root, Local Background Server"

[lib]
name = "custos_daemon"
path = "src/lib.rs"

[[bin]]
name = "custos-daemon"
path = "src/main.rs"

[[bin]]
name = "custos-worker"
path = "src/bin/custos-worker.rs"

[features]
default = ["full"]
full = [
    "custos-packs/full",
    "custos-workbench-quant",
    "custos-workbench-research",
    "custos-workbench-coding",
    "custos-workbench-assistant",
]
lite = [
    "custos-packs/lite",
]
local-inference = [
    "custos-provider/local-inference-native",
]

[dependencies]
custos-domain = { workspace = true }
custos-core = { workspace = true }
custos-provider = { workspace = true }
custos-persistence = { workspace = true }
custos-runtime = { workspace = true }
custos-adapters = { workspace = true }
custos-packs = { workspace = true, default-features = false }
custos-workbench-quant = { workspace = true, optional = true }
custos-workbench-research = { workspace = true, optional = true }
custos-workbench-coding = { workspace = true, optional = true }
custos-workbench-assistant = { workspace = true, optional = true }
custos-protocol = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }


