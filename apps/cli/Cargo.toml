[package]
name = "custos-app-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Custos headless terminal CLI client over LocalApiClient"

[[bin]]
name = "custos"
path = "src/main.rs"

[lib]
name = "cli_lib"
crate-type = ["rlib"]

[dependencies]
clap = { workspace = true }
custos-domain = { workspace = true }
custos-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
