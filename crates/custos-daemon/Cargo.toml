[package]
name = "custos-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Custos Daemon: Composition Root, Local Background Server"

[lib]
name = "custos_daemon"
path = "src/lib.rs"

[[bin]]
name = "custos-daemon"
path = "src/main.rs"

[dependencies]
custos-domain = { workspace = true }
custos-core = { workspace = true }
custos-provider = { workspace = true }
custos-persistence = { workspace = true }
custos-bridge = { workspace = true }
custos-runtime = { workspace = true }
custos-adapters = { workspace = true }

async-trait = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
fs2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }


