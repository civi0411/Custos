[package]
name = "custos-sdk"
version = "0.1.0-alpha.10"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The Custos Development Kit (SDK) for Rust client applications and local API integration"

[lib]
name = "custos_sdk"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
custos-domain = { workspace = true }
custos-protocol = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "net", "io-util", "time", "process"] }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-std", "io-util"] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tempfile = { workspace = true }
