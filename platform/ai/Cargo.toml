[package]
name = "custos-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Custos Unified AI Subsystem: Contracts, Catalog, Cloud Providers, Local Inference, Routing"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
live-websocket = []
mlx = []
local-inference-native = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
local-inference-mlx = ["mlx"]
safemlx = []

[dependencies]
custos-domain = { workspace = true }
custos-core = { workspace = true }
anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
futures = { workspace = true }
include_dir = { workspace = true }
indoc = { workspace = true }
minijinja = { version = "2.7", default-features = false, features = ["serde"] }
once_cell = { workspace = true }
rand = { workspace = true }
regex = { workspace = true, features = ["unicode"] }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
unicode-normalization = { version = "0.1.22", default-features = false, features = ["std"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }
which = { workspace = true }
zstd = "0.14.0"
encoding_rs = "0.8"
fs2 = { workspace = true }
sha2 = { workspace = true }
etcetera = { workspace = true }
libc = { workspace = true }
pulldown-cmark = "0.12"

# Optional local inference dependencies
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["gzip"] }
env-lock = { workspace = true }
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-stream = { workspace = true }
wiremock = { workspace = true }
flate2 = "1.1.9"

[build-dependencies]
zstd = "0.14.0"
