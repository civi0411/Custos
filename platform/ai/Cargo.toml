[package]
name = "custos-provider"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transitional facade over custos-integrations"

[features]
default = ["rustls-tls"]
rustls-tls = ["custos-integrations/rustls-tls"]
native-tls = ["custos-integrations/native-tls"]
live-websocket = ["custos-integrations/live-websocket"]
mlx = ["custos-integrations/mlx"]
local-inference-native = ["custos-integrations/local-inference-native"]
local-inference-mlx = ["custos-integrations/local-inference-mlx"]
safemlx = ["custos-integrations/safemlx"]

[dependencies]
custos-integrations = { workspace = true }
custos-domain = { workspace = true }
custos-core = { workspace = true }

[build-dependencies]
zstd = "0.14.0"
