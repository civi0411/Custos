[package]
name = "custos-integrations"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Custos Unified Integrations: AI Models, System Drivers, Connectors, Protocols & Harnesses"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
live-websocket = []
mlx = []
local-inference-native = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
local-inference-mlx = ["mlx"]
safemlx = []
roaming = ["dep:iroh", "dep:iroh-relay"]
test-support = []

[dependencies]
custos-contracts = { workspace = true }
custos-domain = { workspace = true }
custos-core = { workspace = true }
custos-protocol = { workspace = true }

anyhow = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
dotenvy = { workspace = true }
encoding_rs = "0.8"
etcetera = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
include_dir = { workspace = true }
indoc = { workspace = true }
keyring = { workspace = true }
libc = { workspace = true }
minijinja = { version = "2.7", default-features = false, features = ["serde"] }
once_cell = { workspace = true }
pulldown-cmark = "0.12"
rand = { workspace = true }
regex = { workspace = true, features = ["unicode"] }
reqwest = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
unicode-normalization = { version = "0.1.22", default-features = false, features = ["std"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "std"] }
which = { workspace = true }
zstd = "0.14.0"

# Optional dependencies
iroh = { workspace = true, features = ["tls-aws-lc-rs"], optional = true }
iroh-relay = { workspace = true, optional = true }
llama-cpp-2 = { workspace = true, optional = true }
llama-cpp-sys-2 = { workspace = true, optional = true }

[dev-dependencies]
env-lock = { workspace = true }
flate2 = "1.1.9"
reqwest = { workspace = true, features = ["gzip"] }
tempfile = { workspace = true }
test-case = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-stream = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
zstd = "0.14.0"
