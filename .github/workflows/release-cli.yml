name: Release Custos CLI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: target/release/custos.exe
            asset_name: custos-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_src: target/release/custos
            asset_name: custos-darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_src: target/release/custos
            asset_name: custos-darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_src: target/release/custos
            asset_name: custos-linux-x64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release -p custos-cli

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp ${{ matrix.binary_src }} artifacts/${{ matrix.asset_name }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp ${{ matrix.binary_src }} artifacts/custos.exe
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.asset_name }}
          path: artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM Registry
        if: env.NODE_AUTH_TOKEN != ''
        run: |
          cd custos-npm-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
