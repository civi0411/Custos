name: Rust CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  check-lint-test:
    name: Lint & Test (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Architecture Boundaries
        run: |
          bash scripts/check_deps.sh
          bash scripts/check_naming.sh

      - name: Check Formatting
        continue-on-error: true
        run: cargo fmt --check --all

      - name: Cargo Check Workspace
        run: cargo check --workspace --all-targets

      - name: Clippy Lint
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Core Tests (Blocking)
        run: cargo test -p custos-domain -p custos-core -p custos-persistence -p custos-runtime -p custos-daemon -p custos-sdk -p custos-packs --lib

      - name: Run Workspace Integration Tests
        run: cargo test --workspace --all-targets
