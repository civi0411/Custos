<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">

<head>
  <meta charset="UTF-8" />
  <script>
    // Apply device appearance before the first paint; React owns subsequent updates.
    (() => {
      let preferences = {};
      try { preferences = JSON.parse(localStorage.getItem('custos.appearance.preferences') || '{}') || {}; } catch { }
      const preference = preferences.theme === 'light' || preferences.theme === 'dark' ? preferences.theme : 'system';
      const theme = preference === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference;
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.classList.toggle('dark', theme === 'dark');
      root.style.colorScheme = theme;
      root.dataset.density = preferences.density === 'compact' ? 'compact' : 'comfortable';
      root.dataset.reduceMotion = String(preferences.reduceMotion === true);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custos SADE — Supervised Agent Development Environment</title>
  <meta name="description"
    content="Custos SADE: local-first agent workspace for Coding, Research, and Assistant workbenches." />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <!-- Geist + Geist Mono (Claude Code-style typography) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet" />
</head>

<body class="bg-canvas text-editor-fg font-sans antialiased h-full w-full overflow-hidden flex flex-col select-none">
  <div id="root" class="h-full w-full flex flex-col overflow-hidden"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
