[project]
name = "custos-repo-intelligent"
version = "0.2.0"
description = "Custos Sovereign Codebase AST & Call Graph Intelligence Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.30.0",
    "kuzu>=0.4.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
    "networkx>=3.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
repo-intelligent = "src.main:app"
repo-intel = "src.main:app"
nexus = "src.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]
