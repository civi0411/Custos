    path: "workflows/triage.v1.yaml"
  - id: "draft-message.v1"
    path: "workflows/draft-message.v1.yaml"
policies:
  - id: "user-confirmation.v1"
    path: "policies/user-confirmation.v1.yaml"
verifiers:
  - id: "acceptance.v1"
    path: "verifiers/acceptance.v1.yaml"
