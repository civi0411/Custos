description: "Workflows, prompts, recipes, and verifiers for personal productivity, agenda triage, drafts, and calendar scheduling."
author: "Custos Team"
capabilities:
  - id: "assistant.draft"
    description: "Manage message and email drafts"
  - id: "assistant.triage"
    description: "Triage inbox and prioritize agenda items"
workflows:
