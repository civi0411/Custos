[package]
name = "custos-workbench-coding"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Custos Autonomous Software Engineering Workbench (Codebase intelligence, Git patch operations, regression testing)"

[dependencies]
custos-domain = { path = "../../platform/domain" }
custos-core = { path = "../../platform/core" }
custos-runtime = { path = "../../platform/runtime" }
custos-adapters = { path = "../../platform/adapters" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.0", features = ["sync", "time"] }
thiserror = { workspace = true }
tracing = "0.1"
regex = { workspace = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

