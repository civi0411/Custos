id: "bug-fix.v1"
name: "Bug Fix & Verification Flow"
version: "1.0.0"
steps:
  - id: "triage"
    action: "context.compile"
    recipe: "context-recipes/triage.v1.yaml"
  - id: "diagnose"
    action: "provider.prompt"
    prompt: "prompts/diagnose.v1.md"
  - id: "plan"
    action: "provider.prompt"
    prompt: "prompts/plan.v1.md"
  - id: "implement"
    action: "provider.prompt"
    prompt: "prompts/implement.v1.md"
  - id: "verify"
    action: "verifier.run"
    profile: "verifiers/rust.v1.yaml"
policy: "policies/read-only.v1.yaml"
verifier: "verifiers/rust.v1.yaml"
