[package]
name = "custos-workbench-research"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Custos Sovereign Research Workbench (Academic literature, note-taking, notebooks, citation verification, experiment reproduction)"

[dependencies]
custos-domain = { path = "../../platform/domain" }
custos-core = { path = "../../platform/core" }
custos-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.0", features = ["sync", "time"] }
tracing = "0.1"
sha2 = "0.10"
regex = { workspace = true }
reqwest = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
