id: "risk-audit.v1"
name: "Risk Audit Workflow"
version: "1.0.0"
steps:
  - id: "audit"
    action: "provider.prompt"
    prompt: "prompts/risk.v1.md"
  - id: "verify_sharpe"
    action: "verifier.run"
    profile: "verifiers/deflated-sharpe.v1.yaml"
  - id: "verify_pbo"
    action: "verifier.run"
    profile: "verifiers/pbo-cscv.v1.yaml"
policy: "policies/zero-lookahead.v1.yaml"
verifier: "verifiers/deflated-sharpe.v1.yaml"
